# 每次 push 到 main 分支时，自动把纯静态站点部署到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 也支持在 Actions 页面手动触发
  workflow_dispatch:

# 允许本 workflow 写入 Pages 环境
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传站点文件（仓库根目录即站点根目录）
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
